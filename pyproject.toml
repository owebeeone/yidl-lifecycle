[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yidl-lifecycle"
version = "0.1.0"
description = "Transactional lifecycle decorator compiler built on YIDL"
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["astichi==1.1.3", "yidl==0.1.2", "yidl-cache==0.1.0", "compat-sentinel==0.1.2"]
authors = [{ name = "YIDL contributors" }]
keywords = ["dsl", "compiler", "decorator", "lifecycle", "transactions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.scripts]
yidl-lifecycle-regenerate-base = "yidl_lifecycle.regenerate_lifecycle_base:main"

[project.urls]
Source = "https://github.com/owebeeone/yidl-lifecycle"
Issues = "https://github.com/owebeeone/yidl-lifecycle/issues"
Documentation = "https://github.com/owebeeone/yidl-lifecycle/blob/main/docs/GettingStarted.md"

[project.optional-dependencies]
dev = ["black==26.3.1", "pytest>=7.0"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
astichi = { path = "../astichi", editable = true }
yidl = { path = "../yidl", editable = true }
yidl-cache = { path = "../yidl-cache", editable = true }

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/yidl_lifecycle", "tests", "docs", "dev-docs", "scripts", "RELEASE.md", "gearu.toml", ".release.env"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.yidl.test-matrix]
python = ["3.12", "3.13", "3.14", "3.15"]

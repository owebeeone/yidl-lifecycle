[project]
name = "yidl-lifecycle"
branch = "main"
remote = "origin"
tag_prefix = "v"
github_repo = "owebeeone/yidl-lifecycle"

[python]
version = "static"
manifest = "pyproject.toml"
lockfiles = ["uv.lock"]
# Release worktrees resolve public dependencies, never sibling source overrides.
lock_command = ["uv", "lock", "--no-sources", "--exclude-newer-package", "yidl=0 seconds", "--exclude-newer-package", "yidl-cache=0 seconds", "--python", "3.12"]

[release]
checks = [
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/check_matrix.py"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "build==1.6.1", "python", "-m", "build", "--outdir", "build/release/{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "twine==7.0.0", "python", "-m", "twine", "check", "--strict", "build/release/{python_version}/*"],
]
exact_checks = [
    ["uv", "run", "--no-project", "--python", "3.12", "python", "scripts/check_matrix.py"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "build==1.6.1", "python", "-m", "build", "--outdir", "build/release/{python_version}"],
    ["uv", "run", "--no-project", "--python", "3.12", "--with", "twine==7.0.0", "python", "-m", "twine", "check", "--strict", "build/release/{python_version}/*"],
]
github_notes = """
yidl-lifecycle {tag} — Python 3.15 compatibility patch.

The source and publication matrices now include CPython 3.15 alongside
3.12–3.14. Gearu verifies the release candidate using published dependencies;
GitHub trusted publishing uploads only after its release checks pass.
See RELEASE.md and dev-docs/Python315Release.md for evidence and scope.
"""

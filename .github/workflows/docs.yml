name: Documentation
on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'dev-docs/documentation/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - 'dev-docs/documentation/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifecycle-docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTICHI_LOWER_ENGINE: python
      YIDL_LIFECYCLE_CACHE: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install documentation tools and packaged library
        run: |
          python -m pip install -r docs-requirements.txt
          python -m pip install .
      - name: Execute public examples and tutorial blocks
        run: python dev-docs/documentation/verify_examples.py
      - name: Build and check the public site
        run: |
          python -m mkdocs build --strict
          python dev-docs/documentation/check_site.py build/docs-site
      - name: Upload verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/docs-site
  deploy:
    if: github.repository == 'owebeeone/yidl-lifecycle' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
